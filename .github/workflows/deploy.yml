name: Build and Deploy to Surge

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci

      - name: Build
        run: npm run build

      - name: Vérifier dist/
        run: ls -lah dist/

      - name: Upload de l'artifact dist/
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  deploy-surge:
    needs: build-site
    runs-on: ubuntu-latest
    steps:
      - name: Télécharger l'artifact dist/
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Installer Surge
        run: npm install --global surge

      - name: Déployer sur Surge
        run: surge ./dist "${{ secrets.SURGE_DOMAIN }}" --token "${{ secrets.SURGE_TOKEN }}"
