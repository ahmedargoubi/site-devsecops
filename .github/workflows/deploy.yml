
name: Build and Deploy

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-site:
    name: Build and test site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Build
        run: npm run build

      - name: Vérifier dist/
        run: ls -lah dist/

      - name: Upload de l'artifact dist/
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  security-placeholder:
    name: Security placeholder
    runs-on: ubuntu-latest
    steps:
      - name: Stage réservé à la sécurité
        run: echo "Stage réservé aux séances 9, 10 et 13"

  build-image:
    name: Build and publish Docker image
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}

  deploy-surge:
    name: Deploy to Surge
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-site
    runs-on: ubuntu-latest
    steps:
      - name: Télécharger l'artifact dist/
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Installer Surge
        run: npm install --global surge

      - name: Déployer sur Surge
        run: surge ./dist "${{ secrets.SURGE_DOMAIN }}" --token "${{ secrets.SURGE_TOKEN }}"



  deploy-ec2:
    name: Deploy to AWS EC2
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-image
    runs-on: ubuntu-latest    
    environment:
      name: production

    steps:
      - name: Deploy Docker image on EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            sudo docker pull ghcr.io/${{ github.repository }}:${{ github.sha }}
            sudo docker rm -f site-test || true
            sudo docker rm -f site-devsecops || true
            sudo docker run -d \
              --restart unless-stopped \
              --name site-devsecops \
              -p 8080:80 \
              ghcr.io/${{ github.repository }}:${{ github.sha }}
            sudo docker ps
            curl -I http://localhost:8080
